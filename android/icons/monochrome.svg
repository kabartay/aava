<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Android 13+ themed icons: one flat colour on transparency, which the
       launcher tints to match the wallpaper. Everything is drawn in white and
       the shapes are separated by gaps rather than by colour, because tinting
       collapses every fill to the same value. -->
