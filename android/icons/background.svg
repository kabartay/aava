<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7bd5"/><stop offset="1" stop-color="#cfe8f5"/>
    </linearGradient>
  </defs>
  <!-- Full bleed and square: the launcher applies its own mask, so rounding
       the corners here would only show through as a double edge. -->
  <rect width="128" height="128" fill="url(#sky)"/>
</svg>
