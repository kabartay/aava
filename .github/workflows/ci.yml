name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot
          chmod +x godot

      # Import is not a formality: global class names only exist after it has
      # written .godot/global_script_class_cache.cfg, and a cyclic class_name
      # dependency fails here rather than at run time.
      - name: Import project
        run: |
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log
          if grep -qE "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::import reported script errors"
            exit 1
          fi

      - name: Checks
        run: ~/godot/godot --headless --path . --script src/dev/ci_check.gd

      - name: Export Android APK
        if: github.event_name == 'push'
        run: |
          # Only proves the preset and settings are coherent; there is no
          # keystore here, so a debug export is the most that can be verified.
          echo "skipped: needs a keystore, which does not belong in CI"
