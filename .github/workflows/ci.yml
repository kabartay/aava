name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot
          chmod +x godot

      # Import runs twice. Global class names only exist once
      # .godot/global_script_class_cache.cfg has been written, and on a clean
      # checkout that file is written by the same pass that parses the scripts.
      # The first pass is therefore allowed to complain; only the second has to
      # be silent.
      - name: Import project (first pass writes the class cache)
        run: ~/godot/godot --headless --path . --import > first-import.log 2>&1 || true

      - name: Import project
        run: |
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log
          if grep -qE "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::import reported script errors"
            echo "--- first pass, for comparison:"
            grep -E "SCRIPT ERROR|Parse Error" first-import.log | head -20 || true
            exit 1
          fi

      # GDScript cannot infer a type from an untyped array literal, so
      # `for x in [1.0, 2.0]` makes every `var y := x * 2` a parse error. It has
      # cost this project four separate rounds of debugging, and it is trivially
      # greppable, so it is now simply banned.
      - name: No untyped array literals in for loops
        run: |
          if grep -rnE "^[[:space:]]*for [A-Za-z_]+ in \[" --include="*.gd" src; then
            echo "::error::iterate a typed array (PackedFloat32Array, Array[Vector3], ...) — GDScript cannot infer element types from a bare literal"
            exit 1
          fi

      - name: Checks
        run: ~/godot/godot --headless --path . --script src/dev/ci_check.gd

      - name: Export Android APK
        if: github.event_name == 'push'
        run: |
          # Only proves the preset and settings are coherent; there is no
          # keystore here, so a debug export is the most that can be verified.
          echo "skipped: needs a keystore, which does not belong in CI"
